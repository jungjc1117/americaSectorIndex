name: Update Market Data Index

on:
  schedule:
    # 매일 한국 시간 기준 오전 7:00 (UTC 22:00) 실행
    - cron: '0 8 13 * *'
  workflow_dispatch: # 버튼 눌러서 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance

    - name: Fetch Market Data and Generate HTML
      run: python get_data.py

    - name: Commit and Push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
